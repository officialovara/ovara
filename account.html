<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - OVARA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #111827;
    }

    .header {
      background: #ffffff;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #e5e7eb;
    }

    .back-btn {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    .header h2 {
      font-size: 20px;
    }

    .container {
      padding: 25px 20px;
    }

    .account-card {
      background: #111827;
      color: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .currency {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .account-number {
      font-size: 14px;
      opacity: 0.8;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .action-btn {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      font-size: 15px;
    }

    .action-btn:hover {
      background: #f9fafb;
    }

    .section {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: 25px;
    }

    .section h3 {
      margin-bottom: 15px;
      font-size: 17px;
    }

    .empty {
      color: #6b7280;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h2 id="pageTitle">Account</h2>
  </div>

  <div class="container">

    <div class="account-card">
      <div class="currency" id="currencyName">Currency Account</div>

      <div class="balance" id="balance">
        0.00
      </div>

      <div class="account-number" id="accountNumber">
        Account number: —
      </div>
    </div>

    <div class="actions">

      <button class="action-btn" onclick="alert('Deposit feature coming soon')">
        💰 Deposit
      </button>

      <button class="action-btn" onclick="alert('Send money feature coming soon')">
        ↗️ Send
      </button>

      <button class="action-btn" onclick="alert('Receive money feature coming soon')">
        ↙️ Receive
      </button>

      <button class="action-btn" onclick="alert('Exchange feature coming soon')">
        🔄 Exchange
      </button>

    </div>

    <div class="section">
      <h3>Recent transactions</h3>

      <div class="empty">
        No transactions yet
      </div>
    </div>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const currency = params.get("currency") || "NGN";

    const currencyData = {

      NGN: {
        name: "🇳🇬 Nigerian Naira",
        symbol: "₦",
        balance: "₦0.00",
        number: "NGN account number: —"
      },

      USD: {
        name: "🇺🇸 US Dollar",
        symbol: "$",
        balance: "$0.00",
        number: "USD account number: —"
      },

      GBP: {
        name: "🇬🇧 British Pound",
        symbol: "£",
        balance: "£0.00",
        number: "GBP account number: —"
      },

      EUR: {
        name: "🇪🇺 Euro",
        symbol: "€",
        balance: "€0.00",
        number: "EUR account number: —"
      }

    };

    const account = currencyData[currency] || currencyData.NGN;

    document.getElementById("pageTitle").textContent =
      account.name;

    document.getElementById("currencyName").textContent =
      account.name;

    document.getElementById("balance").textContent =
      account.balance;

    document.getElementById("accountNumber").textContent =
      account.number;

  </script>

</body>
</html>
