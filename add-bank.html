<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Bank — OVARA</title>

<style>
:root{
--bg:#f5f7fb;
--surface:#fff;
--text:#111827;
--muted:#6b7280;
--border:#e5e7eb;
--accent:#111827;
--shadow:0 10px 30px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}
header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
}
.back{
width:42px;
height:42px;
border:none;
border-radius:12px;
background:var(--surface);
box-shadow:var(--shadow);
font-size:18px;
cursor:pointer;
}
.container{
padding:0 20px 120px;
}
.field{
margin-top:20px;
}
label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:8px;
}
select,input{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid var(--border);
font-size:15px;
background:var(--surface);
}
.note{
margin-top:25px;
padding:15px;
border-radius:14px;
background:#eef6ff;
font-size:13px;
line-height:1.5;
}
.save{
position:fixed;
left:20px;
right:20px;
bottom:25px;
border:none;
background:var(--accent);
color:white;
padding:17px;
border-radius:16px;
font-size:16px;
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<button class="back" onclick="history.back()">←</button>

<div>
<h2>Add Bank</h2>
<div style="color:#6b7280;font-size:14px;margin-top:4px;">
Link a withdrawal account securely.
</div>
</div>
</header>

<div class="container">

<div class="field">
<label>Select Bank</label>

<select id="bank">
<option>Access Bank</option>
<option>GTBank</option>
<option>First Bank</option>
<option>UBA</option>
<option>Zenith Bank</option>
<option>Fidelity Bank</option>
<option>Moniepoint</option>
<option>OPay</option>
<option>PalmPay</option>
<option>Kuda</option>
</select>
</div>

<div class="field">
<label>Account Number</label>
<input
id="accountNumber"
type="tel"
maxlength="10"
placeholder="Enter 10-digit account number">
</div>

<div class="field">
<label>Nickname (Optional)</label>
<input
id="nickname"
placeholder="Main Account">
</div>

<div class="note">
🔐 Your linked bank will be used for future OVARA withdrawals.
The first bank you save becomes your Primary account.
</div>

</div>

<button class="save" onclick="saveBank()">
Link Bank
</button>

<script>
function saveBank(){

const bank=document.getElementById("bank").value;
const accountNumber=document.getElementById("accountNumber").value.trim();
const nickname=document.getElementById("nickname").value.trim();

if(accountNumber.length!==10){
alert("Enter a valid 10-digit account number.");
return;
}

let banks=JSON.parse(localStorage.getItem("ovaraLinkedBanks"))||[];

if(banks.length>=5){
alert("You can only save up to 5 bank accounts.");
return;
}

banks.push({
id:Date.now().toString(),
bank,
accountNumber,
accountName:"Account Holder",
nickname:nickname||"Main Account",
primary:banks.length===0
});

localStorage.setItem(
"ovaraLinkedBanks",
JSON.stringify(banks)
);

alert("Bank linked successfully!");

window.location.href="linked-banks.html";
}
</script>

</body>
</html>
