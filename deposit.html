<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deposit - OVARA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    .header {
      background: #ffffff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      border: none;
      background: #f1f5f9;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 25px 20px 40px;
    }

    .intro {
      margin-bottom: 25px;
    }

    .intro h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .intro p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 14px;
    }

    .account-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .currency {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .account-name {
      font-weight: 700;
      font-size: 15px;
    }

    .account-number {
      color: #6b7280;
      font-size: 13px;
      margin-top: 3px;
    }

    .balance {
      font-weight: 700;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      overflow: hidden;
      background: #ffffff;
    }

    .currency-symbol {
      padding-left: 15px;
      font-size: 18px;
      font-weight: 700;
      color: #6b7280;
    }

    input {
      width: 100%;
      border: none;
      outline: none;
      padding: 16px 12px;
      font-size: 18px;
      background: transparent;
    }

    .methods {
      display: grid;
      gap: 12px;
    }

    .method {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .method:hover {
      border-color: #111827;
    }

    .method input {
      width: auto;
      transform: scale(1.2);
    }

    .method-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .method-info strong {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .method-info span {
      color: #6b7280;
      font-size: 12px;
    }

    .continue-btn {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .continue-btn:hover {
      opacity: 0.9;
    }

    .security {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 15px 35px;
      }

      .intro h1 {
        font-size: 25px;
      }

      .card {
        padding: 18px;
      }

      .balance {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h2>Deposit</h2>
  </header>

  <main class="container">

    <section class="intro">
      <h1>Deposit money</h1>
      <p>
        Add money to your OVARA account using one of the available deposit methods.
      </p>
    </section>

    <section class="card">
      <div class="card-title">Deposit to</div>

      <div class="account">
        <div class="account-left">
          <div class="currency">🇳🇬</div>

          <div>
            <div class="account-name">NGN Account</div>
            <div class="account-number">•••• 4821</div>
          </div>
        </div>

        <div class="balance">₦0.00</div>
      </div>
    </section>

    <section class="card">

      <div class="card-title">Deposit amount</div>

      <label for="amount">Amount</label>

      <div class="input-wrapper">
        <span class="currency-symbol">₦</span>
        <input
          type="number"
          id="amount"
          placeholder="0.00"
          min="1"
          inputmode="decimal"
        >
      </div>

    </section>

    <section class="card">

      <div class="card-title">Choose deposit method</div>

      <div class="methods">

        <label class="method">
          <input type="radio" name="method" value="bank" checked>

          <div class="method-icon">🏦</div>

          <div class="method-info">
            <strong>Bank Transfer</strong>
            <span>Transfer money from your bank account</span>
          </div>
        </label>

        <label class="method">
          <input type="radio" name="method" value="card">

          <div class="method-icon">💳</div>

          <div class="method-info">
            <strong>Debit Card</strong>
            <span>Deposit using your debit card</span>
          </div>
        </label>

      </div>

    </section>

    <button class="continue-btn" onclick="continueDeposit()">
      Continue
    </button>

    <div class="security">
      🔒 Your deposit information is protected by OVARA security.
    </div>

  </main>

  <script>
    function goBack() {
      window.location.href = "dashboard.html";
    }

    function continueDeposit() {
      const amount = document.getElementById("amount").value;
      const method = document.querySelector(
        'input[name="method"]:checked'
      );

      if (!amount || Number(amount) <= 0) {
        alert("Please enter a valid deposit amount.");
        return;
      }

      if (!method) {
        alert("Please select a deposit method.");
        return;
      }

      /*
        Deposit processing will be connected here later.

        For now, the page validates the amount and
        selected deposit method without processing
        any real money.
      */

      alert(
        "Deposit setup ready.\n\n" +
        "Amount: ₦" + Number(amount).toLocaleString() +
        "\nMethod: " +
        (method.value === "bank" ? "Bank Transfer" : "Debit Card")
      );
    }
  </script>

</body>
</html>
