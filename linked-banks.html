<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linked Banks — OVARA</title>

<style>
:root{
--bg:#f5f7fb;
--surface:#fff;
--text:#111827;
--muted:#6b7280;
--border:#e5e7eb;
--accent:#111827;
--shadow:0 10px 30px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}
header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
}
.back{
border:none;
background:var(--surface);
border-radius:12px;
width:42px;
height:42px;
font-size:18px;
box-shadow:var(--shadow);
cursor:pointer;
}
.container{
padding:0 20px 100px;
}
.subtitle{
color:var(--muted);
margin-top:6px;
font-size:14px;
}
.bank-list{
margin-top:25px;
display:flex;
flex-direction:column;
gap:14px;
}
.bank-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:18px;
padding:18px;
box-shadow:var(--shadow);
display:flex;
justify-content:space-between;
align-items:center;
}
.bank-info h3{
font-size:16px;
}
.bank-info p{
font-size:13px;
color:var(--muted);
margin-top:4px;
}
.badge{
background:#fde68a;
padding:6px 10px;
border-radius:999px;
font-size:11px;
font-weight:700;
}
.empty{
margin-top:40px;
background:var(--surface);
border:1px dashed var(--border);
border-radius:20px;
padding:35px 20px;
text-align:center;
}
.empty .icon{
font-size:42px;
margin-bottom:12px;
}
.empty h3{
margin-bottom:8px;
}
.empty p{
font-size:13px;
color:var(--muted);
line-height:1.5;
}
.add-btn{
position:fixed;
left:20px;
right:20px;
bottom:25px;
border:none;
background:var(--accent);
color:white;
padding:17px;
border-radius:16px;
font-size:16px;
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<button class="back" onclick="history.back()">←</button>

<div>
<h2>Linked Banks</h2>
<div class="subtitle">Manage your withdrawal accounts securely.</div>
</div>
</header>

<div class="container">

<div id="bankContainer">

<div class="empty">

<div class="icon">🏦</div>

<h3>No linked bank yet</h3>

<p>
Link a bank account to withdraw your OVARA balance.
You can save up to five bank accounts.
</p>

</div>

</div>

</div>

<button class="add-btn" onclick="window.location.href='add-bank.html'">
＋ Add New Bank
</button>

<script>
const container=document.getElementById("bankContainer");

const banks=JSON.parse(localStorage.getItem("ovaraLinkedBanks"))||[];

function mask(num){
return num.slice(0,4)+"****"+num.slice(-2);
}

function loadBanks(){

if(!banks.length)return;

container.innerHTML=banks.map(bank=>`
<div class="bank-card" onclick="startWithdrawal(${banks.indexOf(bank)})" style="cursor:pointer;">

<div class="bank-info">

<h3>${bank.bank}</h3>

<p>${bank.accountName}</p>

<p>${mask(bank.accountNumber)}</p>

</div>

${bank.primary?'<div class="badge">PRIMARY</div>':""}

</div>
`).join("");

}

loadBanks();
function startWithdrawal(index) {
  const selectedBank = banks[index];

  localStorage.setItem(
    "ovaraSelectedBank",
    JSON.stringify(selectedBank)
  );

  window.location.href = "withdraw.html";
}
  
</script>

</body>
  </html>
