<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Withdrawal — OVARA</title>

<style>
:root{
--bg:#f5f7fb;
--surface:#fff;
--text:#111827;
--muted:#6b7280;
--border:#e5e7eb;
--accent:#111827;
--shadow:0 10px 30px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}
header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
}
.back{
width:42px;
height:42px;
border:none;
border-radius:12px;
background:var(--surface);
box-shadow:var(--shadow);
font-size:18px;
cursor:pointer;
}
.container{
padding:0 20px 120px;
}
.hero{
text-align:center;
margin:10px 0 25px;
}
.hero h1{
font-size:38px;
}
.hero p{
color:var(--muted);
margin-top:8px;
}
.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:20px;
box-shadow:var(--shadow);
}
.row{
display:flex;
justify-content:space-between;
padding:14px 0;
}
.row:not(:last-child){
border-bottom:1px solid var(--border);
}
.label{
color:var(--muted);
font-size:14px;
}
.value{
font-weight:700;
}
.total{
font-size:18px;
}
.confirm{
position:fixed;
left:20px;
right:20px;
bottom:25px;
padding:17px;
border:none;
border-radius:16px;
background:var(--accent);
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<button class="back" onclick="history.back()">←</button>
<div>
<h2>Confirm Withdrawal</h2>
</div>
</header>

<div class="container">

<div class="hero">
<h1 id="amount">₦0</h1>
<p>Review your withdrawal before confirming.</p>
</div>

<div class="card">

<div class="row">
<div class="label">Bank</div>
<div class="value" id="bankName">Access Bank</div>
</div>

<div class="row">
<div class="label">Account</div>
<div class="value" id="accountNumber">••••3486</div>
</div>

<div class="row">
<div class="label">Fee</div>
<div class="value">₦0.00</div>
</div>

<div class="row">
<div class="label total">Total</div>
<div class="value total" id="totalAmount">₦0</div>
</div>

</div>

</div>

<button class="confirm" onclick="confirmWithdrawal()">
Confirm Withdrawal
</button>

<script>
const bank=JSON.parse(localStorage.getItem("ovaraSelectedBank"));
const amount=localStorage.getItem("ovaraWithdrawAmount")||"₦0";

document.getElementById("amount").textContent=amount;
document.getElementById("totalAmount").textContent=amount;

if(bank){
document.getElementById("bankName").textContent=bank.bank;
document.getElementById("accountNumber").textContent="••••"+bank.accountNumber.slice(-4);
}

function confirmWithdrawal(){
window.location.href="withdraw-pin.html";
}
</script>

</body>
</html>
